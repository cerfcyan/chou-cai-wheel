<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭菜谱 · 每日菜单</title>
<meta name="description" content="家庭菜谱与每日菜单：菜库、菜品详情、每日菜单、抽菜转盘">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--brand:#a84b38;--brand2:#c96554;--ink:#3f362d;--ink2:#8a7b68;--ink3:#b0a390;--line:#eee5da;--bg:#fffdfa;--card:#fff;}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:inherit;text-decoration:none;}

.topbar{position:sticky;top:0;z-index:20;background:rgba(255,253,250,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;}
.brand{font-size:16px;font-weight:600;letter-spacing:1px;}
.member-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink2);cursor:pointer;}
.tabs{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:49px;z-index:19;}
.tabs a{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:13.5px;color:var(--ink2);}
.tabs a.on{background:var(--brand);color:#fff;}
main{max-width:760px;margin:0 auto;padding:14px 16px 40px;}

.sec-title{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;}
.sec-title h2{font-size:15px;font-weight:600;}
.muted{color:var(--ink3);font-size:12px;}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:12.5px;cursor:pointer;}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:11px;border:none;background:var(--brand);color:#fff;cursor:pointer;font-size:14px;}
.btn:active{opacity:.86;}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid #e6d9cc;}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}
.btn.block{width:100%;}
.btn[disabled]{opacity:.55;}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#faf6f0;border:1px solid var(--line);border-radius:14px;padding:10px 12px;}
.datebar .nav{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;font-size:16px;}
.datebar .cur{flex:1;text-align:center;font-size:15px;font-weight:600;}
.datebar .cur span{display:block;font-weight:400;font-size:11.5px;color:var(--ink3);margin-top:2px;}

.menu-list{display:grid;gap:10px;margin-top:12px;}
.dish-row{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;position:relative;}
.dish-row .thumb{width:78px;height:78px;border-radius:11px;object-fit:cover;background:#f3ece3;flex:0 0 auto;}
.dish-row .info{flex:1;min-width:0;}
.dish-row .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dish-row .meta{font-size:11.5px;color:var(--ink3);margin-top:2px;}
.dish-row .del{position:absolute;right:8px;top:8px;border:none;background:#fbf1ee;color:var(--brand);border-radius:50%;width:24px;height:24px;font-size:14px;line-height:1;cursor:pointer;}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px;}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr);}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;}
.card .cover{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f3ece3;display:block;}
.card .ph{width:100%;aspect-ratio:4/3;background:linear-gradient(135deg,#f5ece2,#e8dccd);display:flex;align-items:center;justify-content:center;color:#9c8c79;font-size:18px;font-weight:600;}
.card .body{padding:9px 10px;}
.card .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .s{font-size:11px;color:var(--ink3);margin-top:3px;}

.search{display:flex;gap:8px;margin-top:10px;}
.search input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;}
.search input:focus{border-color:var(--brand2);}

.empty{text-align:center;color:var(--ink3);padding:40px 10px;font-size:13px;}
.empty .btn{margin-top:14px;}

.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink2);font-size:13px;cursor:pointer;margin-bottom:10px;}

.gallery{display:flex;gap:8px;overflow-x:auto;border-radius:14px;margin-bottom:12px;scroll-snap-type:x mandatory;}
.gallery img{height:230px;border-radius:12px;object-fit:cover;flex:0 0 auto;scroll-snap-align:center;}
.detail-head h1{font-size:20px;margin-bottom:6px;}
.tag{display:inline-block;background:#f7eee8;color:var(--brand);border-radius:999px;padding:2px 10px;font-size:11.5px;margin-right:6px;}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;}
.panel h3{font-size:13px;color:var(--ink2);font-weight:500;margin-bottom:8px;letter-spacing:1px;}
.materials{white-space:pre-wrap;line-height:1.8;font-size:13.5px;}
.steps{list-style:none;counter-reset:s;}
.steps li{counter-increment:s;display:flex;gap:9px;margin-bottom:8px;font-size:13.5px;}
.steps li::before{content:counter(s);flex:0 0 20px;height:20px;border-radius:50%;background:#f7eee8;color:var(--brand);font-size:12px;display:flex;align-items:center;justify-content:center;}
.note{border-top:1px dashed var(--line);padding:10px 0 4px;}
.note:first-child{border-top:none;padding-top:0;}
.note .who{font-size:12px;color:var(--ink3);display:flex;justify-content:space-between;align-items:center;}
.note .txt{margin-top:4px;font-size:13.5px;white-space:pre-wrap;}

.form label{display:block;font-size:12.5px;color:var(--ink2);margin:12px 0 6px;}
.form input[type=text],.form select,.form textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;}
.form textarea{min-height:90px;resize:vertical;}
.err{color:#c0392b;font-size:12px;margin-top:5px;}
.photo-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.photo-grid .p{position:relative;width:84px;height:84px;}
.photo-grid img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
.photo-grid .x{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;border:none;background:var(--brand);color:#fff;font-size:11px;cursor:pointer;}
.step-item{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.step-item .idx{flex:0 0 20px;font-size:12px;color:var(--ink3);}
.step-item input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:10px;}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px;color:var(--ink2);cursor:pointer;font-size:12px;}

.wheel-wrap{position:relative;width:min(88vw,420px);height:min(88vw,420px);margin:6px auto 0;}
.wheel-wrap canvas{width:100%;height:100%;border-radius:50%;display:block;}
.pointer{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:26px solid var(--brand);z-index:5;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12));}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:23%;aspect-ratio:1;border-radius:50%;background:#fff;border:none;cursor:pointer;color:var(--brand);font-size:clamp(19px,5.6vw,28px);font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.10),0 0 0 5px #fdfaf5;}
.hub:active{transform:translate(-50%,-50%) scale(.94);}

.result{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:#faf6f0;padding:12px;display:flex;gap:12px;align-items:center;}
.result img{width:70px;height:70px;border-radius:10px;object-fit:cover;}
.result .n{font-size:17px;font-weight:600;}
.result .c{font-size:12px;color:var(--ink3);margin-top:2px;}
.recent{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.recent .r{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink2);cursor:pointer;}

.modal-mask{position:fixed;inset:0;background:rgba(40,30,24,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0;}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px 22px;max-height:86vh;overflow:auto;}
.sheet h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.sheet .close{border:none;background:transparent;color:var(--ink3);font-size:18px;cursor:pointer;}
.member-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.member-item .nm{flex:1;font-size:14px;}
.member-item .cur{font-size:11px;color:var(--brand);}

.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:rgba(60,45,36,.92);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:80;opacity:0;transition:.25s;pointer-events:none;}
.toast.on{opacity:1;}
.skeleton{background:linear-gradient(90deg,#f5efe8,#fbf7f2,#f5efe8);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;height:90px;}
@keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
</style>
</head>

name":"麻婆豆腐","category":"荤菜","creator":"妈妈","materials":"豆腐1盒、牛肉末或猪肉末80克、郫县豆瓣酱、花椒粉、蒜苗","steps":["豆腐盐水焯","炒肉末与豆瓣酱出红油","加适量水下豆腐烧3分钟","勾芡两次，撒花椒粉与蒜苗出锅"],"photos":["assets/p/fcbb21be-7780-4e87-8528-70468019a4b1_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.607Z","updatedAt":"2026-11-18T05:12:44.607Z"},{"id":"ce3fea6c-4190-4914-9317-93b284dc3afb","name":"肉末豆腐","category":"荤菜","creator":"妈妈","materials":"嫩豆腐1盒、猪肉末80克、郫县豆瓣酱或生抽、葱花、淀粉","steps":["豆腐切块盐水焯","热油炒肉末至酥散","加豆瓣酱或生抽与少量水","下豆腐轻推烧3分钟，勾薄芡撒葱花"],"photos":["assets/p/ce3fea6c-4190-4914-9317-93b284dc3afb_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.599Z","updatedAt":"2026-11-18T05:12:44.599Z"},{"id":"0f1b8a12-ef6f-47d1-a7df-cc949f82e912","name":"木须肉","category":"荤菜","creator":"妈妈","materials":"猪肉片100克、鸡蛋2个、木耳、黄花菜、黄瓜片、葱姜、盐","steps":["木耳、黄花菜泡发","滑炒肉片盛出，鸡蛋炒散盛出","爆香葱姜，下所有食材","加盐翻匀出锅"],"photos":["assets/p/0f1b8a12-ef6f-47d1-a7df-cc949f82e912_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.592Z","updatedAt":"2026-11-18T05:12:44.592Z"},{"id":"66b15a39-c051-474d-b968-dfe4e4629dc8","name":"莴笋炒肉片","category":"荤菜","creator":"妈妈","materials":"莴笋1根、猪肉片150克、蒜末、盐","steps":["莴笋去皮切片，快速焯水","肉片腌制后滑油盛出","下莴笋大火翻炒","倒回肉片，加盐翻匀"],"photos":["assets/p/66b15a39-c051-474d-b968-dfe4e4629dc8_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.584Z","updatedAt":"2026-11-18T05:12:44.584Z"},{"id":"72139b08-944b-463e-a5c4-61797e5c160f","name":"蒜苔炒肉丝","category":"荤菜","creator":"妈妈","materials":"蒜苔250克、猪里脊150克、生抽、盐","steps":["肉丝腌制后滑油盛出","蒜苔煸炒至起皱断生","下肉丝，加生抽、少盐翻匀出锅"],"photos":["assets/p/72139b08-944b-463e-a5c4-61797e5c160f_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.576Z","updatedAt":"2026-11-18T05:12:44.576Z"},{"id":"53a1fc36-f283-44bb-95a4-58a1863fd594","name":"辣椒炒肉","category":"荤菜","creator":"妈妈","materials":"前腿肉或五花肉250克、螺丝椒3根、蒜末、豆豉、生抽","steps":["辣椒干煸出虎皮斑盛出","肥肉片煸出油，下瘦肉片炒变色","下蒜末、豆豉爆香","回锅辣椒，加生抽大火翻匀"],"photos":["assets/p/53a1fc36-f283-44bb-95a4-58a1863fd594_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.568Z","updatedAt":"2026-11-18T05:12:44.568Z"},{"id":"8d4425ef-fa79-4790-b5be-6a083763a494","name":"鱼香肉丝","category":"荤菜","creator":"妈妈","materials":"猪里脊250克、木耳丝、笋丝或胡萝卜丝、泡椒末或郫县豆瓣酱、糖、醋、酱油、淀粉","steps":["肉丝加盐、淀粉腌制后滑油盛出","配菜切丝","底油炒泡椒末出红油，下肉丝配菜","兑鱼香汁（糖、醋、酱油、淀粉、水）翻匀出锅"],"photos":["assets/p/8d4425ef-fa79-4790-b5be-6a083763a494_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.561Z","updatedAt":"2026-11-18T05:12:44.561Z"},{"id":"ab155314-50ba-483d-b2b3-a1fa67c2bf12","name":"糖醋里脊","category":"荤菜","creator":"妈妈","materials":"猪里脊300克、淀粉、蛋清、番茄酱、糖、醋","steps":["里脊切条，挂淀粉蛋清糊","油炸定型后捞出，升高油温复炸至金黄","番茄酱、糖、醋熬成浓汁","下肉条快速裹汁出锅"],"photos":["assets/p/ab155314-50ba-483d-b2b3-a1fa67c2bf12_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.554Z","updatedAt":"2026-11-18T05:12:44.554Z"},{"id":"3119a7e9-3985-4f4a-9fde-939bd4259416","name":"清炒虾仁","category":"荤菜","creator":"妈妈","materials":"虾仁250克、盐、料酒、蛋清、淀粉、葱花","steps":["虾仁用盐、料酒、蛋清、淀粉上浆","温油滑熟虾仁盛出","底油可下豌豆或葱段爆香","回锅虾仁翻匀，撒葱花出锅"],"photos":["assets/p/3119a7e9-3985-4f4a-9fde-939bd4259416_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.547Z","updatedAt":"2026-11-18T05:12:44.547Z"},{"id":"f44bc594-fd96-4bc9-b3f7-957e78c2bb2e","name":"油爆虾","category":"荤菜","creator":"妈妈","materials":"河虾300克、葱姜、生抽、糖、料酒","steps":["虾剪须、开背","油温高时下虾，爆至壳脆色红","下葱姜、料酒、生抽、糖","快速翻炒裹汁出锅"],"photos":["assets/p/f44bc594-fd96-4bc9-b3f7-957e78c2bb2e_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.540Z","updatedAt":"2026-11-18T05:12:44.540Z"},{"id":"6ebabac1-9a78-499a-aac3-4013dc161e0c","name":"白灼虾","category":"荤菜","creator":"妈妈","materials":"鲜活河虾或基围虾500克、姜片、料酒、生抽、姜丝","steps":["水加姜片、料酒烧开","下虾煮2-3分钟，变红即捞出","可过一下冰水更弹","配生抽姜丝蘸食"],"photos":["assets/p/6ebabac1-9a78-499a-aac3-4013dc161e0c_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.533Z","updatedAt":"2026-11-18T05:12:44.533Z"},{"id":"4a84e78c-ce40-4264-90e8-e0537fdadcff","name":"红烧鲫鱼","category":"荤菜","creator":"妈妈","materials":"鲫鱼1条、葱姜蒜、生抽老抽、糖、料酒","steps":["鲫鱼擦干水分，煎至两面金黄","下葱姜蒜爆香，加料酒、酱油、糖与开水没过一半","中火焖10分钟，大火收汁装盘"],"photos":["assets/p/4a84e78c-ce40-4264-90e8-e0537fdadcff_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.526Z","updatedAt":"2026-11-18T05:12:44.526Z"},{"id":"3e378b7c-aded-448c-b8d8-9ad9ab18cd18","name":"清蒸鲈鱼","category":"荤菜","creator":"妈妈","materials":"鲈鱼1条、葱姜、蒸鱼豉油、食用油","steps":["鱼身两面划刀，塞姜葱段","水开后蒸8-10分钟，倒掉蒸汁、去掉姜葱","铺新鲜葱姜丝，淋蒸鱼豉油","烧一勺热油浇上激出香味"],"photos":["assets/p/3e378b7c-aded-448c-b8d8-9ad9ab18cd18_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.519Z","updatedAt":"2026-11-18T05:12:44.519Z"},{"id":"b1fba67f-7ff3-4bf2-b92c-10e0bf58cde7","name":"红烧带鱼","category":"荤菜","creator":"妈妈","materials":"带鱼1条、葱姜、生抽、糖、料酒","steps":["带鱼切段擦干，煎至两面金黄","下葱姜爆香，加料酒、生抽、糖与适量水","中火焖10分钟","大火收汁装盘"],"photos":["assets/p/b1fba67f-7ff3-4bf2-b92c-10e0bf58cde7_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.513Z","updatedAt":"2026-11-18T05:12:44.513Z"},{"id":"2bbed1cc-8395-4c96-bbbe-ab8276eea139","name":"红烧大排","category":"荤菜","creator":"妈妈","materials":"猪大排4块、生抽老抽、糖、葱姜、淀粉、料酒","steps":["大排用刀背拍松，加料酒、生抽、淀粉腌20分钟","油煎至两面金黄","加葱姜、酱油、糖与适量水焖10分钟","大火收汁出锅"],"photos":["assets/p/2bbed1cc-8395-4c96-bbbe-ab8276eea139_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.505Z","updatedAt":"2026-11-18T05:12:44.505Z"},{"id":"9c3c76d5-023a-4fca-ad13-553da1e988f8","name":"糖醋排骨","category":"荤菜","creator":"妈妈","materials":"猪排骨500克、料酒、生抽、糖、醋、姜片","steps":["排骨焯水沥干","少油煸至微黄","按1勺料酒、2勺生抽、3勺糖、4勺醋、5勺水的比例调汁下锅","小火焖25分钟，大火收汁裹亮"],"photos":["assets/p/9c3c76d5-023a-4fca-ad13-553da1e988f8_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.498Z","updatedAt":"2026-11-18T05:12:44.498Z"},{"id":"427df7ac-b23c-4fc6-9abc-8e88a23442e7","name":"红烧排骨","category":"荤菜","creator":"妈妈","materials":"猪排骨500克、冰糖、生抽老抽、料酒、葱姜、八角","steps":["排骨冷水下锅焯去血沫","少油小火炒糖色，下排骨上色","加葱姜、八角、料酒、生抽老抽","加开水小火焖40分钟，大火收汁"],"photos":["assets/p/427df7ac-b23c-4fc6-9abc-8e88a23442e7_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.491Z","updatedAt":"2026-11-18T05:12:44.491Z"},{"id":"078a0893-ecb9-4b64-93b6-86904e162481","name":"虾仁炒鸡蛋","category":"荤菜","creator":"妈妈","materials":"虾仁200克、鸡蛋3个、料酒、盐、淀粉、葱花","steps":["虾仁去虾线，加料酒、盐、淀粉抓匀腌10分钟","蛋液加盐打散","滑炒虾仁至变色盛出","倒入蛋液，半凝固时下虾仁，翻匀撒葱花"],"photos":["assets/p/078a0893-ecb9-4b64-93b6-86904e162481_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.484Z","updatedAt":"2026-11-18T05:12:44.484Z"},{"id":"bbb11bcb-4884-4f67-9c37-db093b481e4e","name":"榨菜蛋汤","category":"汤","creator":"妈妈","materials":"榨菜1包（约80克）、鸡蛋2个、葱花、香油","steps":["榨菜切丝，冲去部分咸味","水开下榨菜煮2分钟","淋入蛋液成蛋花","撒葱花、滴香油，可加少量生抽提味"],"photos":["assets/p/bbb11bcb-4884-4f67-9c37-db093b481e4e_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.477Z","updatedAt":"2026-11-18T05:12:44.477Z"},{"id":"37a6bd96-a939-4aa3-bbfe-d73dde5bb92b","name":"罗宋汤","category":"汤","creator":"妈妈","materials":"牛腩300克（或红肠）、番茄2个、土豆1个、胡萝卜半根、洋葱半个、卷心菜几片、番茄酱、黄油、盐、糖","steps":["牛腩切块焯水（用红肠则切片待用）","洋葱、土豆、胡萝卜、卷心菜切块","黄油炒洋葱与番茄酱出香，下牛腩加热水炖1小时","下土豆、胡萝卜、卷心菜与番茄再炖20分钟","加盐、糖调味，牛肉酥烂即成"],"photos":["assets/p/37a6bd96-a939-4aa3-bbfe-d73dde5bb92b_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.470Z","updatedAt":"2026-11-18T05:12:44.470Z"},{"id":"0fbc11b4-a76f-4766-9584-6a767498b7b3","name":"酸辣菜","category":"凉菜","creator":"妈妈","materials":"卷心菜（或娃娃菜）700克、盐35克、白醋200克、糖150克、红辣椒7个","steps":["卷心菜去梗取叶，切丝（生食凉菜，刀具案板容器按熟食标准洗净）","菜丝拌盐腌1小时杀水","冷水冲洗后尽量挤干水分","加白醋、糖、辣椒圈拌匀，尝咸淡酌情调整","冷藏过夜，隔天更入味，随吃随取（酸甜辣度可自行增减）"],"photos":["assets/p/0fbc11b4-a76f-4766-9584-6a767498b7b3_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.463Z","updatedAt":"2026-11-18T05:12:44.463Z"},{"id":"1663094a-4783-43dc-b125-03064e94734b","name":"卷心菜钱油豆腐","category":"素菜","creator":"妈妈","materials":"卷心菜半棵（约500克）、小油豆腐10个、大蒜粒、盐、味精、麻油","steps":["卷心菜去老叶切成约3厘米长条，小油豆腐一切二","锅内入油，油热爆香大蒜粒","下卷心菜煸炒，再下小油豆腐同炒","加盐，略加水焖煮一会儿","开盖翻炒，加味精调味，淋麻油出锅"],"photos":["assets/p/1663094a-4783-43dc-b125-03064e94734b_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.456Z","updatedAt":"2026-11-18T05:12:44.456Z"},{"id":"26f597dc-2789-48b4-beeb-f16664c692c6","name":"番茄蛋汤","category":"汤","creator":"妈妈","materials":"番茄1个、鸡蛋2个、葱花、盐、香油","steps":["番茄切块，油炒出汁","加开水煮沸","淋入蛋液搅出蛋花","加盐，撒葱花、滴香油"],"photos":["assets/p/26f597dc-2789-48b4-beeb-f16664c692c6_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.449Z","updatedAt":"2026-11-18T05:12:44.449Z"},{"id":"f65f953b-262f-4e2e-963a-2085c8c46d4f","name":"腊肉炒芸豆","category":"荤菜","creator":"妈妈","materials":"腊肉150克、芸豆400克、蒜姜葱、干辣椒、生抽","steps":["腊肉温水泡软后切片","芸豆去筋掰段，焯熟后过凉水","少油下腊肉煸出油脂","下葱姜蒜、干辣椒爆香，下芸豆翻炒","加生抽、少盐翻匀出锅（腊肉自带咸味，盐要少放）"],"photos":["assets/p/f65f953b-262f-4e2e-963a-2085c8c46d4f_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.442Z","updatedAt":"2026-11-18T05:12:44.442Z"},{"id":"ffa2f822-e364-4f05-b4aa-99c7a131beb0","name":"土豆烧鸡块","category":"荤菜","creator":"妈妈","materials":"鸡腿2个、土豆2个、生抽老抽、糖、葱姜、料酒","steps":["鸡块焯水去沫","油煸葱姜，下鸡块煸炒","加料酒、生抽、老抽、糖上色","加开水焖15分钟，下土豆块再焖10分钟","大火收汁出锅"],"photos":["assets/p/ffa2f822-e364-4f05-b4aa-99c7a131beb0_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.435Z","updatedAt":"2026-11-18T05:12:44.435Z"},{"id":"9fbe0403-8ba8-4186-9d61-6e13e8c59211","name":"韭菜炒蛋","category":"素菜","creator":"妈妈","materials":"韭菜250克、鸡蛋3个、盐","steps":["鸡蛋加盐打散，炒熟盛出","韭菜切段，热油快炒","韭菜变软即倒回鸡蛋翻匀出锅"],"photos":["assets/p/9fbe0403-8ba8-4186-9d61-6e13e8c59211_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.428Z","updatedAt":"2026-11-18T05:12:44.428Z"},{"id":"23b760c2-5f5c-4713-bf46-6150469e25ed","name":"番茄炒卷心菜","category":"素菜","creator":"妈妈","materials":"卷心菜半棵、番茄1个、蒜末、盐、糖","steps":["卷心菜切片，番茄切块","油炒番茄出汁","下卷心菜大火翻炒至断生，加盐、糖出锅"],"photos":["assets/p/23b760c2-5f5c-4713-bf46-6150469e25ed_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.421Z","updatedAt":"2026-11-18T05:12:44.421Z"},{"id":"8f27201b-6304-4012-a83b-0fee9b3aa304","name":"红烧荷包蛋","category":"素菜","creator":"妈妈","materials":"鸡蛋3个、生抽老抽、糖、葱花","steps":["热油煎荷包蛋至边缘微焦","加生抽、老抽、糖与少量水","烧2分钟入味，撒葱花出锅"],"photos":["assets/p/8f27201b-6304-4012-a83b-0fee9b3aa304_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.414Z","updatedAt":"2026-11-18T05:12:44.414Z"},{"id":"5239bdd6-7d78-4a2f-adc6-7126e1d09fec","name":"炖蛋","category":"素菜","creator":"妈妈","materials":"鸡蛋3个、温水、盐、香油、葱花","steps":["鸡蛋加盐打散","加1.2-1.5倍温水搅匀，过筛去泡","盖盘中小火蒸10分钟","淋少许香油、撒葱花"],"photos":["assets/p/5239bdd6-7d78-4a2f-adc6-7126e1d09fec_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.407Z","updatedAt":"2026-11-18T05:12:44.407Z"},{"id":"965e7adf-74e4-4d3f-967e-2a901b260e1f","name":"肉沫炖蛋","category":"荤菜","creator":"妈妈","materials":"鸡蛋3个、猪肉末80克、温水、盐、生抽、葱花","steps":["鸡蛋加盐打散，加约1.2倍温水搅匀，过筛去泡","盖盘中小火蒸10分钟至凝固","另锅把肉末加生抽煸至酥香","肉末连汁浇在炖蛋上，撒葱花"],"photos":["assets/p/965e7adf-74e4-4d3f-967e-2a901b260e1f_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.400Z","updatedAt":"2026-11-18T05:12:44.400Z"},{"id":"902a3e89-d425-41aa-8bd5-0472dc2b0f50","name":"白菜炒粉丝","category":"素菜","creator":"妈妈","materials":"大白菜半棵、粉丝1把、蒜末、生抽、盐","steps":["粉丝泡软剪段","热油爆香蒜末","先下白菜帮再下菜叶炒软","加生抽、少量水，下粉丝翻匀炒透，加盐出锅"],"photos":["assets/p/902a3e89-d425-41aa-8bd5-0472dc2b0f50_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.393Z","updatedAt":"2026-11-18T05:12:44.393Z"},{"id":"b2f89a9c-9882-455c-add3-2290baeed89a","name":"蚂蚁上树","category":"荤菜","creator":"妈妈","materials":"粉丝1把、猪肉末100克、郫县豆瓣酱、葱姜蒜末、生抽","steps":["粉丝温水泡软","热油炒肉末至变色酥散","下豆瓣酱、葱姜蒜末炒出红油","加生抽与适量水，下粉丝翻炒吸汁","中火收汁至粉丝透明即出锅"],"photos":["assets/p/b2f89a9c-9882-455c-add3-2290baeed89a_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.386Z","updatedAt":"2026-11-18T05:12:44.386Z"},{"id":"1b61c352-68db-4368-ad32-01221769a2d4","name":"回锅肉（花菜或卷心菜）","category":"荤菜","creator":"妈妈","materials":"带皮五花肉或二刀肉300克、花菜半棵或卷心菜半棵、郫县豆瓣酱、甜面酱、葱姜蒜","steps":["整块肉冷水下锅煮至筷子能插透，捞出晾凉切薄片","花菜掰小朵焯水（用卷心菜则切片）","小火煸肉片至卷曲出油","下豆瓣酱炒出红油，加甜面酱、葱姜蒜","下配菜大火翻炒至断生出锅"],"photos":["assets/p/1b61c352-68db-4368-ad32-01221769a2d4_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.380Z","updatedAt":"2026-11-18T05:12:44.380Z"},{"id":"043bc7ac-7613-40b5-b2ff-0295c2deb381","name":"菠菜","category":"素菜","creator":"妈妈","materials":"菠菜300克、蒜末、盐","steps":["菠菜洗净，沸水中快速焯水去草酸","热油爆香蒜末","下菠菜大火翻炒，加盐出锅"],"photos":["assets/p/043bc7ac-7613-40b5-b2ff-0295c2deb381_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.372Z","updatedAt":"2026-11-18T05:12:44.372Z"},{"id":"d28d43c3-4059-4db5-b676-79abacd42745","name":"茼蒿菜","category":"素菜","creator":"妈妈","materials":"茼蒿300克、蒜末、盐","steps":["茼蒿洗净沥干","热油爆香蒜末","大火快炒茼蒿，加盐立即出锅（久炒易发苦）"],"photos":["assets/p/d28d43c3-4059-4db5-b676-79abacd42745_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.365Z","updatedAt":"2026-11-18T05:12:44.365Z"},{"id":"05e56086-8968-4571-9526-bc8db8c170c9","name":"红烧肉","category":"荤菜","creator":"妈妈","materials":"五花肉500克、冰糖、生抽老抽、料酒、葱姜、八角","steps":["五花肉切块，冷水下锅焯去血沫","少油小火炒糖色，下肉块煸炒上色","加葱姜、八角、料酒、生抽老抽","加开水小火焖40-50分钟，大火收汁至浓亮"],"photos":["assets/p/05e56086-8968-4571-9526-bc8db8c170c9_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.358Z","updatedAt":"2026-11-18T05:12:44.358Z"},{"id":"52ef274b-aae9-4e35-801a-b4e81985c367","name":"红烧萝卜","category":"素菜","creator":"妈妈","materials":"白萝卜1根、生抽老抽、糖、葱花","steps":["萝卜去皮切滚刀块","油煸后加酱油、糖上色","加开水没过，小火焖15分钟至酥","大火收汁，撒葱花出锅"],"photos":["assets/p/52ef274b-aae9-4e35-801a-b4e81985c367_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.351Z","updatedAt":"2026-11-18T05:12:44.351Z"},{"id":"353d1666-9d4e-4a57-9509-8d68ef287f82","name":"鸡毛菜蘑菇汤","category":"汤","creator":"妈妈","materials":"蘑菇100克、鸡毛菜100克、姜片、食用油、盐、白胡椒粉","steps":["鸡毛菜洗净，蘑菇撕碎或切碎（更入味）","锅内放少量油，煎香姜片","下蘑菇炒软，加开水煮3-5分钟","下鸡毛菜，滚开即关火，加盐和白胡椒粉"],"photos":["assets/p/353d1666-9d4e-4a57-9509-8d68ef287f82_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.344Z","updatedAt":"2026-11-18T05:12:44.344Z"},{"id":"0b2f4142-3e53-41db-98fb-e1b234d4b817","name":"土豆刀豆","category":"素菜","creator":"妈妈","materials":"刀豆300克、土豆1个、生抽、糖、盐","steps":["刀豆去两头筋掰段，土豆切条","刀豆先焯水或下锅煸炒至完全变色（务必熟透）","下土豆条同炒，加生抽、糖与少量水","中小火焖5分钟至酥，大火收汁"],"photos":["assets/p/0b2f4142-3e53-41db-98fb-e1b234d4b817_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.336Z","updatedAt":"2026-11-18T05:12:44.336Z"},{"id":"1e22d1c8-a5fa-41e8-8a74-96cbf2052a81","name":"青椒土豆丝","category":"素菜","creator":"妈妈","materials":"土豆2个、青椒1个、蒜末、白醋、盐","steps":["土豆切丝，冲洗去表面淀粉","热油爆香蒜末，下土豆丝大火翻炒","沿锅边淋白醋，加盐","下青椒丝炒至断生立即出锅"],"photos":["assets/p/1e22d1c8-a5fa-41e8-8a74-96cbf2052a81_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.329Z","updatedAt":"2026-11-18T05:12:44.329Z"},{"id":"f3876c51-5d42-4ccd-b1af-88788dffb6ca","name":"番茄炒蛋","category":"素菜","creator":"妈妈","materials":"番茄2个、鸡蛋3个、盐、糖、葱花","steps":["鸡蛋加少许盐打散，热油炒至刚凝固盛出","番茄切块下锅炒出汁，加糖、盐","倒回鸡蛋翻匀，撒葱花出锅"],"photos":["assets/p/f3876c51-5d42-4ccd-b1af-88788dffb6ca_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.322Z","updatedAt":"2026-11-18T05:12:44.322Z"},{"id":"44d5233d-287c-446f-8199-15df375f13b7","name":"番茄豆腐","category":"素菜","creator":"妈妈","materials":"番茄2个、嫩豆腐1盒、蒜末、盐、糖、葱花","steps":["豆腐切块焯水","番茄去皮切块，油炒出汁","下豆腐轻推，加盐、糖与少量水焖3分钟","撒葱花出锅"],"photos":["assets/p/44d5233d-287c-446f-8199-15df375f13b7_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.316Z","updatedAt":"2026-11-18T05:12:44.316Z"},{"id":"4753320e-d88d-4878-b3e3-44fe2b9c0a5b","name":"咸菜豆腐","category":"素菜","creator":"妈妈","materials":"雪里蕻咸菜100克、嫩豆腐1盒、蒜末、糖","steps":["豆腐切块，盐水里焯一下更紧实","底油爆香蒜末，下咸菜炒香","加豆腐与少量水，小火煮5分钟","加糖调和咸味，轻轻推匀出锅"],"photos":["assets/p/4753320e-d88d-4878-b3e3-44fe2b9c0a5b_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.308Z","updatedAt":"2026-11-18T05:12:44.308Z"},{"id":"b0787365-7a15-4162-a724-8bfc28722b44","name":"红烧素鸡","category":"素菜","creator":"妈妈","materials":"素鸡2根、葱姜、生抽老抽、糖","steps":["素鸡切厚片","油煎至两面金黄起泡盛出","底油爆香葱姜，加适量水、生抽、老抽、糖","放入素鸡小火焖5分钟入味，大火收汁"],"photos":["assets/p/b0787365-7a15-4162-a724-8bfc28722b44_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.301Z","updatedAt":"2026-11-18T05:12:44.301Z"},{"id":"5c146d92-f527-4269-ae9a-a027fc98f38b","name":"青椒肉丝炒毛豆","category":"荤菜","creator":"妈妈","materials":"猪瘦肉丝150克、青椒2个、毛豆仁200克、葱姜末、料酒、生抽老抽、盐、糖","steps":["肉丝加料酒、生抽、少许淀粉腌15分钟","热油滑炒肉丝至变色盛出","底油爆香葱姜，下毛豆仁炒至变色，加少量水焖至七八成熟","下青椒丝与肉丝，加盐、糖、生抽翻匀，大火收干汤汁出锅"],"photos":["assets/p/5c146d92-f527-4269-ae9a-a027fc98f38b_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.294Z","updatedAt":"2026-11-18T05:12:44.294Z"},{"id":"49648368-cb2d-4171-9bda-a564b3d96aec","name":"茄子","category":"素菜","creator":"妈妈","materials":"长茄子2根、蒜末、葱花、生抽、糖、盐","steps":["茄子切滚刀块，撒盐腌10分钟后挤去水分","锅中多放油，下茄子煸炒至软身盛出","底油爆香蒜末，倒回茄子","加生抽、糖翻匀入味，撒葱花出锅"],"photos":["assets/p/49648368-cb2d-4171-9bda-a564b3d96aec_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.283Z","updatedAt":"2026-11-18T05:12:44.283Z"},{"id":"b33f4919-85cc-4017-905e-ad918681a08b","name":"面筋塞肉","category":"荤菜","creator":"妈妈","materials":"油面筋15个、猪肉糜300克、鸡蛋1个、葱末姜末、生抽老抽蚝油、冰糖、八角桂皮香叶","steps":["肉糜加盐、白胡椒粉、十三香、料酒、生抽、老抽、蚝油、一个鸡蛋、葱姜末，顺一个方向拌匀上劲","油面筋用手指戳洞撑出内部空间（勿戳破），用筷子把肉馅塞满","热油爆香葱白姜片，肉面朝下煎定型","加开水没过面筋大半，放八角桂皮香叶、冰糖、生抽老抽蚝油，中小火加盖焖15分钟，中途翻两次面","大火收汁出锅，撒葱花"],"photos":["assets/p/b33f4919-85cc-4017-905e-ad918681a08b_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.276Z","updatedAt":"2026-11-18T05:12:44.276Z"},{"id":"07dafc41-891b-4c59-9afc-bd3478f49de6","name":"萝卜丝荷包蛋汤","category":"汤","creator":"妈妈","materials":"白萝卜半根、鸡蛋2个、葱花、盐、香油","steps":["白萝卜去皮擦成丝","少油把两个鸡蛋煎成荷包蛋，边缘煎至金黄","下萝卜丝略炒，加开水煮5分钟至汤色发白","加盐，撒葱花、滴几滴香油出锅"],"photos":["assets/p/07dafc41-891b-4c59-9afc-bd3478f49de6_0.jpg"],"notes":[],"createdAt":"2026-11-18T05:12:44.264Z","updatedAt":"2026-11-18T05:12:44.264Z"},{"id":"0c3c1294-c12c-43ff-b7c4-bcf39864e77a","name":"冬瓜排骨汤","category":"汤","creator":"妈妈","materials":"排骨 400 克\n冬瓜 300 克\n姜 3 片\n枸杞 一小把\n盐 适量","steps":["排骨冷水下锅焯水，冲洗干净。","排骨加姜片和足量清水，大火烧开转小火炖 40 分钟。","冬瓜去皮切厚片，放入汤里再炖 15 分钟。","加盐调味，撒枸杞和葱花。"],"photos":["assets/p/0c3c1294-c12c-43ff-b7c4-bcf39864e77a_0.jpg"],"notes":[],"createdAt":"2026-11-18T04:09:17.533Z","updatedAt":"2026-11-18T04:09:17.533Z"},{"id":"868e6a34-b545-4033-a608-2ecbf8a59887","name":"葱油拌面","category":"素菜","creator":"小满","materials":"细面条 150 克\n小葱 1 把\n生抽 2 勺\n老抽 半勺\n糖 1 小勺","steps":["小葱切段，冷油下锅，小火慢炸到葱段焦黄。","葱油里加生抽、老抽、糖，小火煮开成酱汁。","面条煮熟捞出，过一下温水沥干。","浇两勺葱油酱汁拌匀，放上葱段。"],"photos":["assets/p/868e6a34-b545-4033-a608-2ecbf8a59887_0.jpg"],"notes":[],"createdAt":"2026-11-18T04:09:17.519Z","updatedAt":"2026-11-18T04:09:17.519Z"},{"id":"e13c6b69-598d-4b3b-8b9c-47136ffb6acc","name":"土豆炖牛腩","category":"荤菜","creator":"爸爸","materials":"牛腩 500 克\n土豆 2 个\n胡萝卜 1 根\n姜片 4 片\n八角 1 个\n生抽 2 勺\n老抽 半勺","steps":["牛腩切块，冷水下锅焯水去浮沫，捞出洗净。","热锅下油，姜片、八角炒香，放牛腩煸炒。","加生抽、老抽上色，倒热水没过牛腩，小火炖 60 分钟。","放土豆和胡萝卜块，再炖 20 分钟到软糯，收汁调味。"],"photos":["assets/p/e13c6b69-598d-4b3b-8b9c-47136ffb6acc_0.jpg"],"notes":[],"createdAt":"2026-11-18T04:09:17.505Z","updatedAt":"2026-11-18T04:09:17.505Z"},{"id":"e8224014-6c0e-43c0-8d9d-1362ec55f1d1","name":"蒜蓉菠菜","category":"素菜","creator":"妈妈","materials":"菠菜 1 把\n大蒜 4 瓣\n盐 少许\n食用油 适量","steps":["菠菜洗净沥干，大蒜切末。","水开下菠菜焯 20 秒，捞出挤干水分。","热油爆香一半蒜末，下菠菜大火快炒。","加盐调味，关火后拌入剩下的生蒜末。"],"photos":["assets/p/e8224014-6c0e-43c0-8d9d-1362ec55f1d1_0.jpg"],"notes":[],"createdAt":"2026-11-18T04:09:17.491Z","updatedAt":"2026-11-18T04:09:17.491Z"},{"id":"3908e7db-99d3-4219-9d05-bf5ae92efdb3","name":"可乐鸡翅","category":"荤菜","creator":"爸爸","materials":"鸡翅中 10 个\n可乐 1 罐\n生抽 2 勺\n姜 3 片\n料酒 1 勺","steps":["鸡翅两面划两刀，冷水下锅焯水，捞出擦干。","锅里少油，鸡翅煎到两面金黄。","加姜片、料酒、生抽，倒入可乐没过鸡翅。","大火烧开转小火焖 15 分钟，最后大火收汁。"],"photos":["assets/p/3908e7db-99d3-4219-9d05-bf5ae92efdb3_0.jpg"],"notes":[],"createdAt":"2026-11-18T04:09:17.344Z","updatedAt":"2026-11-18T04:09:17.344Z"},{"id":"cd2d2b2d-c15f-4239-9146-8106f77c4d75","name":"西红柿炒蛋","category":"素菜","creator":"妈妈","materials":"鸡蛋 3 个\n西红柿 2 个\n小葱 1 根\n盐 少许\n糖 半勺","steps":["鸡蛋打散，加一小撮盐搅匀；西红柿切滚刀块。","热锅多放一点油，倒入蛋液，凝固后盛出。","余油下西红柿，中火炒出汁，加半勺糖和盐。","倒回鸡蛋翻匀，撒葱花出锅。"],"photos":["assets/p/cd2d2b2d-c15f-4239-9146-8106f77c4d75_0.jpg","assets/p/cd2d2b2d-c15f-4239-9146-8106f77c4d75_1.jpg"],"notes":[],"createdAt":"2026-11-18T04:09:17.327Z","updatedAt":"2026-11-18T04:09:17.327Z"}],"menu":[{"date":"2026-11-17","dishId":"e13c6b69-598d-4b3b-8b9c-47136ffb6acc","dishName":"土豆炖牛腩","picker":"爸爸","pickedAt":"2026-11-17T04:09:17.576Z"},{"date":"2026-11-17","dishId":"e8224014-6c0e-43c0-8d9d-1362ec55f1d1","dishName":"蒜蓉菠菜","picker":"妈妈","pickedAt":"2026-11-17T04:14:17.590Z"}]}</script>
<script>
"use strict";
/* ======================= 数据层 ======================= */
var SEED = JSON.parse(document.getElementById("seed-data").textContent);
var LS = "familyMenu.v1";
var SCHEMA = { members: [], dishes: [], menu: [], currentMemberId: null, recentWheel: [] };
var state = null;

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function seedState(){
  return {
    members: clone(SEED.members),
    dishes: clone(SEED.dishes),
    menu: clone(SEED.menu),
    currentMemberId: null,
    recentWheel: []
  };
}

function load(){
  try{
    var raw = localStorage.getItem(LS);
    if(!raw) return seedState();
    var s = JSON.parse(raw);
    if(!s || !Array.isArray(s.dishes)) return seedState();
    Object.keys(SCHEMA).forEach(function(k){ if(!(k in s)) s[k] = SCHEMA[k]; });
    return s;
  }catch(e){ return seedState(); }
}

function save(){
  try{ localStorage.setItem(LS, JSON.stringify(state)); }
  catch(e){ toast("本地存储空间不足，请删除部分自建菜品的照片"); }
}

state = load();

/* ======================= 工具 ======================= */
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : "id-"+Date.now()+"-"+Math.random().toString(16).slice(2)); }
var toastTimer = null;
function toast(msg){
  var t = el("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 1900);
}
function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function shiftDate(ds, n){
  var d = new Date(ds + "T00:00:00");
  d.setDate(d.getDate()+n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDate(ds){
  var d = new Date(ds+"T00:00:00");
  var w = "日一二三四五六"[d.getDay()];
  return (d.getMonth()+1) + "月" + d.getDate() + "日 周" + w;
}
function relDay(ds){
  var t = todayStr();
  if(ds===t) return "今天";
  if(ds===shiftDate(t,-1)) return "昨天";
  if(ds===shiftDate(t,1)) return "明天";
  return "";
}
function currentMember(){
  return state.members.filter(function(m){ return m.id===state.currentMemberId; })[0] || null;
}
function memberName(id){
  var m = state.members.filter(function(x){ return x.id===id; })[0];
  return m ? m.nickname : "家人";
}
function dishById(id){
  return state.dishes.filter(function(d){ return d.id===id; })[0] || null;
}
function nowISO(){ return new Date().toISOString(); }
function coverOf(d){
  return (d && d.photos && d.photos.length) ? d.photos[0] : "";
}
function catGrad(cat){
  var map = {"荤菜":["#f6e7e0","#e9d2c8","#a84b38"],"素菜":["#eef3e6","#dbe6cd","#6b8455"],"汤":["#eaf0f4","#d5e2ea","#5a7d92"],"凉菜":["#f3edf5","#e0d6e6","#7b6a8a"]};
  return map[cat] || ["#f4efe7","#e3d9cc","#8a7b68"];
}

/* ======================= 路由 ======================= */
var routes = { home:null, dishes:null, wheel:null };

function route(){
  var h = location.hash.replace(/^#/, "") || "/";
  var parts = h.split("/").filter(Boolean);
  var view = el("view");
  var tab = "home";

  if(parts.length === 0){ tab = "home"; routes.home(view); }
  else if(parts[0] === "dishes"){
    tab = "dishes";
    if(parts[1] === "new"){ routes.dishForm(view, null); }
    else if(parts[1] && parts[2] === "edit"){ routes.dishForm(view, parts[1]); }
    else if(parts[1]){ routes.detail(view, parts[1]); }
    else { routes.dishes(view); }
  }
  else if(parts[0] === "wheel"){ tab = "wheel"; routes.wheel(view); }
  else { routes.notFound(view); }

  Array.prototype.forEach.call(el("mainTabs").children, function(a){
    a.classList.toggle("on", a.dataset.tab === tab);
  });
  el("memberBtn").textContent = "👤 " + (currentMember() ? currentMember().nickname : "选择成员");
  window.scrollTo({ top: 0 });
}

/* ======================= 今日菜单 ======================= */
var menuDate = todayStr();

routes.home = function(view){
  var items = state.menu.filter(function(m){ return m.date === menuDate; });
  var rel = relDay(menuDate);
  var html = "" +
    '<div class="datebar">' +
      '<button class="nav" id="dPrev">‹</button>' +
      '<div class="cur">' + fmtDate(menuDate) + '<span>' + (rel ? rel + " · " : "") + "共 " + items.length + " 道菜</span></div>" +
      '<button class="nav" id="dNext">›</button>' +
    '</div>' +
    '<div class="chips">' +
      '<button class="chip" data-day="-1">昨天</button>' +
      '<button class="chip" data-day="0">今天</button>' +
      '<button class="chip" data-day="1">明天</button>' +
      '<button class="chip" id="pickDate">选日期</button>' +
    '</div>';

  if(items.length){
    html += '<div class="menu-list">';
    items.forEach(function(m){
      var d = dishById(m.dishId);
      var cov = d ? coverOf(d) : (m.coverUrl || "");
      var thumb = cov ? '<img class="thumb" src="' + esc(cov) + '" alt="">' : '<div class="thumb"></div>';
      var time = m.pickedAt ? new Date(m.pickedAt) : null;

    '<div class="search"><input id="pkSearch" placeholder="搜索菜名"></div>' +
    '<div class="chips" id="pkChips"></div>' +

function addToMenu(dishId, date){
  date = date || menuDate;
  var m = currentMember();

      '<div style="height:20px"></div>' +
    '</div>';

    el("photoGrid").innerHTML = photos.map(function(p,i){
      return '<div class="p"><img src="' + esc(p) + '" alt=""><button class="x" data-p="' + i + '">×</button></div>';
    }).join("");
    Array.prototype.forEach.call(el("photoGrid").querySelectorAll("[data-p]"), function(b){
      b.onclick = function(){ photos.splice(Number(b.dataset.p),1); renderPhotos(); };
    });

    el("stepList").innerHTML = steps.map(function(s,i){
      return '<div class="step-item"><span class="idx">' + (i+1) + '</span>' +
        '<input type="text" data-step="' + i + '" value="' + esc(s) + '" placeholder="第 ' + (i+1) + ' 步">' +
        '<button class="icon-btn" data-up="' + i + '">↑</button>' +
        '<button class="icon-btn" data-del="' + i + '">×</button></div>';
    }).join("");
    Array.prototype.forEach.call(el("stepList").querySelectorAll("[data-step]"), function(inp){
      inp.oninput = function(){ steps[Number(inp.dataset.step)] = inp.value; };
    });
    Array.prototype.forEach.call(el("stepList").querySelectorAll("[data-up]"), function(b){
      b.onclick = function(){
        var i = Number(b.dataset.up);
        if(i === 0) return;
        var t = steps[i-1]; steps[i-1] = steps[i]; steps[i] = t;
        renderSteps();
      };
    });
    Array.prototype.forEach.call(el("stepList").querySelectorAll("[data-del]"), function(b){
      b.onclick = function(){
        if(steps.length === 1){ steps[0] = ""; } else { steps.splice(Number(b.dataset.del),1); }

    files.slice(0, room).forEach(function(f){
      var reader = new FileReader();
      reader.onload = function(){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height, max = 900;
          if(w > max){ h = h * max / w; w = max; }
          var c = document.createElement("canvas"); c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          photos.push(c.toDataURL("image/jpeg", 0.72));

      };
      reader.readAsDataURL(f);
    });
    ev.target.value = "";

    var payload = {
      name: name, category: cat, materials: mat, steps: cleanSteps, photos: photos,
      updatedAt: nowISO(), creator: editing ? editing.creator : m.nickname
    };
    if(editing){
      Object.keys(payload).forEach(function(k){ editing[k] = payload[k]; });
      save(); toast("已保存"); location.hash = "#/dishes/" + editing.id;
    } else {
      var nd = Object.assign({ id: uid(), createdAt: nowISO(), notes: [] }, payload);
      state.dishes.unshift(nd);
      save(); toast("已添加"); location.hash = "#/dishes/" + nd.id;
    }
  };
};

/* ======================= 转盘 ======================= */
var wheelState = { cat: "全部", rotation: 0, spinning: false, picked: -1, list: [] };

routes.wheel = function(view){
  var cats = ["全部","荤菜","素菜","汤","凉菜"];
  view.innerHTML =
    '<div class="sec-title"><h2>今天吃什么</h2><span class="muted" id="wheelCount"></span></div>' +
    '<div class="chips" id="wChips"></div>' +
    '<div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel"></canvas><button class="hub" id="hub">转</button></div>' +
    '<div style="text-align:center;margin-top:14px"><button class="btn" id="spinBtn">开始转</button></div>' +
    '<div id="wheelResult"></div>' +
    '<div class="panel" style="margin-top:16px"><h3>最近转到 <span style="float:right"><button class="btn ghost sm" id="clearRecent">清空</button></span></h3><div class="recent" id="recentBox"></div></div>';

  wheelState.cat = wheelState.cat || "全部";
  el("wChips").innerHTML = cats.map(function(c){
    return '<button class="chip' + (c===wheelState.cat?" on":"") + '" data-c="' + c + '">' + c + '</button>';
  }).join("");
  Array.prototype.forEach.call(el("wChips").children, function(b){
    b.onclick = function(){
      if(wheelState.spinning) return;
      wheelState.cat = b.dataset.c; wheelState.rotation = 0; wheelState.picked = -1;
      routes.wheel(view);
    };
  });

  wheelState.list = state.dishes.filter(function(d){ return wheelState.cat==="全部" || d.category===wheelState.cat; });
  el("wheelCount").textContent = "共 " + wheelState.list.length + " 道菜，一道一格";

  if(!wheelState.list.length){
    view.querySelector(".wheel-wrap").style.display = "none";
    el("spinBtn").style.display = "none";
    el("wheelResult").innerHTML = '<div class="empty">这个分类还没有菜<br><button class="btn" onclick="location.hash=\'#/dishes/new\'">去加菜</button></div>';
    return;
  }
  fitWheel();
  drawWheel();

  el("hub").onclick = spin;
  el("spinBtn").onclick = spin;
  el("clearRecent").onclick = function(){
    if(!state.recentWheel.length) return;
    state.recentWheel = []; save(); renderRecent();
  };
  renderResult(null);
  renderRecent();
};

function fitWheel(){
  var canvas = el("wheel");
  if(!canvas) return;
  var box = canvas.parentElement.getBoundingClientRect();
  var css = Math.floor(Math.max(220, Math.min(box.width, box.height)));
  var dpr = window.devicePixelRatio || 1;
  canvas.style.width = css + "px";
  canvas.style.height = css + "px";
  canvas.width = Math.round(css * dpr); canvas.height = Math.round(css * dpr);
  canvas.dataset.css = css;
  canvas.dataset.dpr = dpr;
}

function drawWheel(){
  var canvas = el("wheel");
  if(!canvas) return;
  var ctx = canvas.getContext("2d");
  var n = wheelState.list.length;
  if(!n) return;
  var css = Number(canvas.dataset.css) || canvas.width;
  var dpr = Number(canvas.dataset.dpr) || 1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var R = css / 2 - 3, cx = css/2, cy = css/2;
  var hubR = R * 0.23;
  ctx.clearRect(0,0,css,css);

  var seg = Math.PI*2/n;
  var fs = n<=8?16:n<=12?14:n<=18?13:n<=24?12:n<=36?10:n<=52?9:n<=80?8:7;
  var pad = Math.max(6, R*0.035);
  var maxChars = Math.floor((R - pad - hubR)/fs);
  var colors = ["#f4eee4","#efe7da","#f7f2ea"];

  for(var i=0;i<n;i++){
    var a0 = -Math.PI/2 + i*seg + wheelState.rotation;
    var a1 = a0 + seg;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a0,a1);
    ctx.fillStyle = colors[i%3]; ctx.fill();
    if(wheelState.picked === i){
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a0,a1);
      ctx.fillStyle = "rgba(168,75,56,.16)"; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx,cy,R,a0,a1);
    ctx.strokeStyle = "rgba(255,255,255,.95)";
    ctx.lineWidth = n>60?1:(n>24?1.6:2.6); ctx.stroke();

    var mid = a0 + seg/2;
    var norm = ((mid % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
    var flip = norm > Math.PI/2 && norm < Math.PI*1.5;
    var label = wheelState.list[i].name;
    if(label.length > maxChars) label = label.slice(0, Math.max(1,maxChars-1)) + "…";

    ctx.save(); ctx.translate(cx,cy); ctx.rotate(flip ? mid+Math.PI : mid);
    ctx.fillStyle = "#6b5a47";
    ctx.font = fs + "px system-ui,-apple-system,'PingFang SC',sans-serif";
    ctx.textBaseline = "middle";
    if(flip){ ctx.textAlign="left"; ctx.fillText(label, -(R-pad), 0); }
    else { ctx.textAlign="right"; ctx.fillText(label, R-pad, 0); }
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.strokeStyle="#e6dccd"; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,hubR+3,0,Math.PI*2); ctx.fillStyle="#fdfaf5"; ctx.fill();
}

var revealAll = false;

function renderResult(d){
  var box = el("wheelResult");
  if(!box) return;
  if(!d){ box.innerHTML = ""; return; }
  var cov = coverOf(d);
  var g = catGrad(d.category);
  box.innerHTML = '<div class="result">' +
    (cov ? '<img src="' + esc(cov) + '" alt="">' : '<div style="width:70px;height:70px;border-radius:10px;background:linear-gradient(135deg,' + g[0] + ',' + g[1] + ')"></div>') +
    '<div style="flex:1;min-width:0"><div class="n">' + esc(d.name) + '</div><div class="c">' + esc(d.category) + '</div></div>' +
    '<div style="display:flex;flex-direction:column;gap:6px">' +
      '<button class="btn sm" id="addToday">加入今天菜单</button>' +
      '<button class="btn ghost sm" id="seeDish">看看做法</button>' +
    '</div></div>';
  el("addToday").onclick = function(){ addToMenu(d.id); };
  el("seeDish").onclick = function(){ location.hash = "#/dishes/" + d.id; };
}

function renderRecent(){
  var box = el("recentBox");
  if(!box) return;
  var items = (state.recentWheel||[]).map(dishById).filter(Boolean);
  box.innerHTML = items.length ? items.map(function(d){
    return '<button class="r" data-r="' + esc(d.id) + '">' + esc(d.name) + ' ＋</button>';
  }).join("") : '<span class="muted">还没有记录</span>';
  Array.prototype.forEach.call(box.querySelectorAll("[data-r]"), function(b){
    b.onclick = function(){ addToMenu(b.dataset.r); };
  });
}

function spin(){
  if(wheelState.spinning || !wheelState.list.length) return;
  wheelState.spinning = true;
  wheelState.picked = -1;
  var hub = el("hub"), btn = el("spinBtn");
  if(hub) hub.disabled = true;
  if(btn){ btn.disabled = true; btn.textContent = "转动中…"; }
  renderResult(null);

  var n = wheelState.list.length, seg = Math.PI*2/n;
  var idx = Math.floor(Math.random()*n);
  var targetMod = (Math.PI*2 - (idx*seg + seg/2)) % (Math.PI*2);
  var currentMod = ((wheelState.rotation % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  var rounds = 6 + Math.floor(Math.random()*3);
  var delta = targetMod - currentMod + Math.PI*2*rounds;
  var from = wheelState.rotation, dur = 3600, start = null;

  function frame(ts){
    if(start === null) start = ts;
    var p = Math.min(1, (ts-start)/dur);
    wheelState.rotation = from + delta * (1 - Math.pow(1-p,3));
    drawWheel();
    if(p < 1){ requestAnimationFrame(frame); }
    else {
      wheelState.rotation = from + delta;
      wheelState.picked = idx;
      drawWheel();
      wheelState.spinning = false;
      if(hub) hub.disabled = false;
      if(btn){ btn.disabled = false; btn.textContent = "再转一次"; }
      renderResult(wheelState.list[idx]);
      state.recentWheel = state.recentWheel || [];
      state.recentWheel = [wheelState.list[idx].id].concat(state.recentWheel.filter(function(x){ return x !== wheelState.list[idx].id; })).slice(0,6);
      save(); renderRecent();
    }
  }
  requestAnimationFrame(frame);
}

/* ======================= 成员 ======================= */
function memberModal(fromWrite){
  var cur = currentMember();
  openSheet('<h3>家庭成员 <button class="close" id="mClose">×</button></h3>' +
    '<div id="mList"></div>' +
    '<div style="margin-top:14px;display:flex;gap:8px"><input type="text" id="newName" placeholder="新成员昵称" style="flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px"><button class="btn sm" id="addMember">添加</button></div>' +
    '<div class="muted" style="margin-top:14px">数据保存在本机浏览器里，换设备可用「导出/导入」迁移。</div>' +
    '<div style="display:flex;gap:10px;margin-top:10px"><button class="btn ghost sm" id="expBtn" style="flex:1">导出备份</button><button class="btn ghost sm" id="impBtn" style="flex:1">导入备份</button><input type="file" id="impFile" accept=".json" style="display:none"></div>');
  el("mClose").onclick = closeSheet;

  function renderList(){
    el("mList").innerHTML = state.members.map(function(m){
      var isCur = m.id === state.currentMemberId;
      return '<div class="member-item"><span class="nm">' + esc(m.nickname) + '</span>' +
        (isCur ? '<span class="cur">当前</span>' : '<button class="btn ghost sm" data-use="' + esc(m.id) + '">切换</button>') +
        '<button class="icon-btn" data-rename="' + esc(m.id) + '">改</button></div>';
    }).join("");
    Array.prototype.forEach.call(el("mList").querySelectorAll("[data-use]"), function(b){
      b.onclick = function(){ state.currentMemberId = b.dataset.use; save(); closeSheet(); route(); };
    });
    Array.prototype.forEach.call(el("mList").querySelectorAll("[data-rename]"), function(b){
      b.onclick = function(){
        var m = state.members.filter(function(x){ return x.id===b.dataset.rename; })[0];
        var nn = prompt("新的昵称", m.nickname);
        if(nn && nn.trim()){ m.nickname = nn.trim(); save(); renderList(); route(); }
      };
    });
  }
  renderList();

  el("addMember").onclick = function(){
    var nn = el("newName").value.trim();
    if(!nn){ toast("请输入昵称"); return; }
    state.members.push({ id: uid(), nickname: nn, createdAt: nowISO() });
    state.currentMemberId = state.members[state.members.length-1].id;
    save(); renderList(); route(); toast("已添加成员");
  };

  el("expBtn").onclick = function(){
    var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "家庭菜谱备份-" + todayStr() + ".json";
    a.click();
  };
  el("impBtn").onclick = function(){ el("impFile").click(); };
  el("impFile").onchange = function(ev){
    var f = ev.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var s = JSON.parse(r.result);
        if(!s || !Array.isArray(s.dishes)) throw new Error("bad");
        state = s; save(); closeSheet(); route(); toast("导入成功");
      }catch(e){ toast("文件格式不对"); }
    };
    r.readAsText(f);
  };
}

/* ======================= 弹层 ======================= */
function openSheet(html){
  var mask = document.createElement("div");
  mask.className = "modal-mask";
  mask.id = "sheetMask";
  mask.innerHTML = '<div class="sheet">' + html + '</div>';
  document.body.appendChild(mask);
  mask.addEventListener("click", function(ev){ if(ev.target === mask) closeSheet(); });
}
function closeSheet(){
  var m = el("sheetMask");
  if(m) m.remove();
}
